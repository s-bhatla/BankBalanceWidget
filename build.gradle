plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.3.21'
}

def privacyPolicyUrl = providers.gradleProperty('privacyPolicyUrl').orElse('').get()
if (privacyPolicyUrl && !(privacyPolicyUrl ==~ /https:\/\/[A-Za-z0-9][A-Za-z0-9.:\-]*(?:\/[A-Za-z0-9._~\/%\-]*)?/)) {
    throw new GradleException('privacyPolicyUrl must be a public HTTPS URL')
}

android {
    buildFeatures { buildConfig = true }
    namespace 'local.balancewidget'
    compileSdk 36
    defaultConfig {
        applicationId 'local.balancewidget'
        minSdk 26
        targetSdk 36
        buildConfigField "String", "PRIVACY_POLICY_URL", '"' + privacyPolicyUrl + '"'
        versionCode 25
        versionName '0.10.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
